name: Documentation problem
description: Report inaccurate, missing, or unclear public documentation.
title: "docs: "
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Link to the exact page or file.
      placeholder: https://github.com/0xprogrammable/submit-template/blob/main/README.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Include a source when the correction changes a factual claim.
